<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>Network · Collectivize</title>
    <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="network.css">
    <link rel="stylesheet" href="profile-card.css">
    <link rel="stylesheet" href="nav.css">
    <script src="nav.js"></script>
    <script src="shared.js" defer></script>
    <script src="network-data.js" defer></script>
    <script src="network-layout.js" defer></script>
    <script src="network-view.js" defer></script>
    <script src="profile-render.js" defer></script>
    <script src="profile-editor.js" defer></script>
    <script src="profile-card.js" defer></script>
    <script src="connections-panel.js" defer></script>
    <script src="network.js" defer></script>
</head>
<body>
    <main class="network-page">
        <header class="nw-header">
            <div>
                <h1 class="nw-title">Network</h1>
                <p class="nw-subtitle">Click anyone or any community to see their network and their page side by side.</p>
            </div>
            <div class="nw-controls">
                <button type="button" class="page-button" id="nw-home" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>
                    Back to you
                </button>
            </div>
        </header>

        <div class="nw-banner" id="nw-banner" role="alert" hidden>
            <span id="nw-banner-text"></span>
            <button type="button" class="page-button" id="nw-retry">Retry</button>
        </div>

        <p class="nw-notice" id="nw-notice" role="status" aria-live="polite" hidden></p>

        <p class="nw-empty" id="nw-empty" hidden></p>

        <!-- The network of whoever is in the middle, filling the page. -->
        <div id="nw-root" aria-live="polite"></div>

        <div class="nw-lists" id="nw-lists" hidden>
            <section class="nw-section" id="nw-shared" hidden>
                <h3 id="nw-shared-title">My communities</h3>
                <ul class="nw-list" id="nw-shared-list"></ul>
            </section>
            <section class="nw-section" id="nw-people" hidden>
                <h3 id="nw-people-title">My connections</h3>
                <ul class="nw-list" id="nw-people-list"></ul>
            </section>
        </div>

        <!-- Requests waiting for you, requests you've sent, and invite links. -->
        <div class="nw-connections" id="nw-connections"></div>
    </main>
</body>
</html>
